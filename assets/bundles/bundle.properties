settings.music-settings-title = Spare Music Settings
settings.music-toggles-title = Toggle Settings
settings.music-toggles-desc = Remember to exit and re-enter maps for changes to occur!
settings.music-special-title = Special Settings
settings.debug-toggles-title = Debug Settings

setting.vanilla-music.name = Vanilla Music 
setting.vanilla-music.description = Whether to play vanilla music regardless if a planet \
    \nhas custom music. If toggled off, vanilla music will only play if \
    \nthe planet doesn't have custom music for each respective \
    \nmusic set (Ambient, Dark Boss).

setting.weather-music.name = Weather Music
setting.weather-music.description = Enable weather specific music to be played.
setting.planet-music.name = Planet Specific Music
setting.planet-music.description = Enable custom planet specific music to be played
setting.interplanetary-music.name = Interplanetary Music
setting.interplanetary-music.description = Allows any planet specific music to play from all planets. Overrides planet specific music toggle.
setting.global-music.name = Global Music
setting.global-music.description = Whether to play global music at all.

setting.debug-console.name = Debug Music in Console
setting.debug-console.description = Show special information like what music will be played on the planet when you play on a sector. Will display in the console (F8).


setting.tooltip-erekir = Enables Erekir unique music, UNIMPLEMENTED!
settings.tooltip-github = Open the Github Repo
